components:
  parameters:
    HomeId:
      name: id
      in: path
      required: true
      description: The home's number, its level and position, such as 0704.
      schema: { type: string, pattern: "^[0-9]{4}$" }
    ViewingRef:
      name: ref
      in: path
      required: true
      schema: { type: string }
    LeadId:
      name: id
      in: path
      required: true
      schema: { type: integer }
    ReservationRef:
      name: ref
      in: path
      required: true
      schema: { type: string }
    LeadStage:
      name: stage
      in: query
      schema: { $ref: "#/components/schemas/Stage" }
    LeadAgent:
      name: agent
      in: query
      description: Only this member's leads. The manager alone may choose; an agent always sees only their own.
      schema: { type: integer, minimum: 1 }
    LeadQuery:
      name: q
      in: query
      description: Name, email, phone or interest containing this.
      schema: { type: string }
    LeadSource:
      name: source
      in: query
      description: Only leads from this source, such as Paid social or Referral.
      schema: { type: string }
    LeadSort:
      name: sort
      in: query
      description: Latest activity first when left out.
      schema: { type: string, enum: [recent, name, follow, board] }

  responses:
    Problem:
      description: A problem document.
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    DeskLeadChanged:
      description: Changed; the lead's page as it now stands, with what the change did.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DeskLeadPage" }
    DeskReservationDecided:
      description: Decided; the reservation and its home as they now stand.
      content:
        application/json:
          schema: { $ref: "#/components/schemas/DeskReservationResult" }

  securitySchemes:
    deskSession:
      type: apiKey
      in: cookie
      name: oriel_desk
      description: |
        A member of the sales team's session, set by signing in. It belongs
        to the copy it was made on, which the oriel_copy cookie names.

  schemas:
    Problem:
      type: object
      description: An error, as RFC 9457 describes.
      required: [type, title, status]
      properties:
        type: { type: string, description: "A URI whose last part names the problem: validation, slot-taken, not-available, busy, rate-limited, not-found, server, and on the desk signed-out, bad-sign-in, managers-only, not-yours and lead-exists." }
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        errors:
          type: object
          description: What to say beside each form field that needs another look.
          additionalProperties: { type: string }

    Date:
      type: string
      description: A day in Nairobi.
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}$"
    DateOrEmpty:
      type: string
      pattern: "^([0-9]{4}-[0-9]{2}-[0-9]{2})?$"
    LocalTime:
      type: string
      description: A time in Nairobi, to the minute.
      pattern: "^[0-9]{4}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}$"
    Rect:
      type: array
      description: A rectangle as [x0, y0, x1, y1] in metres.
      items: { type: number }
      minItems: 4
      maxItems: 4
    Status:
      type: string
      enum: [available, held, reserved, sold, withheld]

    Home:
      type: object
      required: [id, level, number, type, typeName, typeShort, title, bedrooms, bathrooms, study, dsq, internal, outdoor, outdoorName, facing, facings, aspect, riverView, corner, sun, status, price]
      properties:
        id: { type: string }
        level: { type: integer }
        number: { type: integer }
        type: { type: string, enum: [A, B, C, D, P] }
        typeName: { type: string }
        typeShort: { type: string }
        title: { type: string }
        bedrooms: { type: integer }
        bathrooms: { type: integer }
        study: { type: boolean }
        dsq: { type: boolean }
        internal: { type: integer, description: "Floor area inside, in square metres." }
        outdoor: { type: integer }
        outdoorName: { type: string }
        facing:
          type: array
          items: { type: string, enum: [N, S, E, W] }
        facings: { type: string, description: "Written out: north and west." }
        aspect: { type: string }
        riverView: { type: boolean }
        corner: { type: boolean }
        sun: { type: number, description: Hours of direct sun on an average day. }
        status: { $ref: "#/components/schemas/Status" }
        price:
          type: [integer, "null"]
          description: In KES. Null when the home is reserved, sold or withheld.

    TypeSummary:
      type: object
      required: [code, name, short, bedrooms, bathrooms, study, dsq, internal, outdoor, outdoorName, parking, summary, features, total, available, withheld, from]
      properties:
        code: { type: string, enum: [A, B, C, D, P] }
        name: { type: string }
        short: { type: string }
        bedrooms: { type: integer }
        bathrooms: { type: integer }
        study: { type: boolean }
        dsq: { type: boolean }
        internal: { type: integer }
        outdoor: { type: integer }
        outdoorName: { type: string }
        parking: { type: integer }
        summary: { type: string }
        features: { type: array, items: { type: string } }
        total: { type: integer }
        available: { type: integer }
        withheld: { type: integer, description: Held back for a later release. }
        from: { type: [integer, "null"] }

    Overview:
      type: object
      required: [asOf, available, total, from, counts, types, completion, progress, priceList]
      properties:
        asOf: { $ref: "#/components/schemas/Date" }
        available: { type: integer }
        total: { type: integer }
        from: { type: integer }
        counts:
          type: object
          additionalProperties: { type: integer }
        types: { type: array, items: { $ref: "#/components/schemas/TypeSummary" } }
        completion: { $ref: "#/components/schemas/Date" }
        progress: { $ref: "#/components/schemas/ProgressBrief" }
        priceList: { $ref: "#/components/schemas/DateOrEmpty" }

    ProgressBrief:
      type: object
      required: [percent, current, frame]
      properties:
        percent: { type: integer }
        current: { type: string }
        frame: { type: number }

    Filter:
      type: object
      required: [beds, max, floors, side, all, sort]
      properties:
        beds: { type: integer }
        max: { type: integer }
        floors: { type: string, enum: ["", lower, middle, upper] }
        side: { type: string, enum: ["", river, garden] }
        all: { type: boolean }
        sort: { type: string, enum: [price, price-desc, floor, size] }

    HomeList:
      type: object
      required: [homes, filter, available, total, from, types]
      properties:
        homes: { type: array, items: { $ref: "#/components/schemas/Home" } }
        filter: { $ref: "#/components/schemas/Filter" }
        available: { type: integer }
        total: { type: integer }
        from: { type: integer }
        types: { type: array, items: { $ref: "#/components/schemas/TypeSummary" } }

    HomeDetail:
      type: object
      required: [home, type, plan, handed, north, light, floor, schedules, similar]
      properties:
        home: { $ref: "#/components/schemas/Home" }
        type: { $ref: "#/components/schemas/TypeSummary" }
        plan: { $ref: "#/components/schemas/Plan" }
        handed: { type: boolean, description: The plan is the mirror image of its type's. }
        north: { type: integer, description: "Degrees clockwise from the top of the plan to north." }
        light: { $ref: "#/components/schemas/Light" }
        floor: { $ref: "#/components/schemas/Floor" }
        schedules:
          type: array
          description: One per payment plan; empty when the home's price is not shown.
          items: { $ref: "#/components/schemas/Schedule" }
        similar: { type: array, items: { $ref: "#/components/schemas/Home" } }

    Floor:
      type: object
      description: The level a home is on, from above. Rectangles are [x0, z0, x1, z1], north towards smaller z.
      required: [level, plate, core, homes]
      properties:
        level: { type: integer }
        plate: { $ref: "#/components/schemas/Rect" }
        core:
          oneOf:
            - { $ref: "#/components/schemas/Rect" }
            - { type: "null" }
        homes:
          type: array
          items:
            type: object
            required: [number, foot, bay]
            properties:
              number: { type: integer }
              foot: { $ref: "#/components/schemas/Rect" }
              bay: { $ref: "#/components/schemas/Rect" }

    Light:
      type: object
      required: [months, best, worst, averageDay, morningShare]
      properties:
        months:
          type: array
          items:
            type: object
            required: [month, morning, afternoon]
            properties:
              month: { type: integer, minimum: 1, maximum: 12 }
              morning: { type: number }
              afternoon: { type: number }
        best: { type: integer }
        worst: { type: integer }
        averageDay: { type: number }
        morningShare: { type: number }

    Schedule:
      type: object
      required: [plan, listPrice, discount, price, completion, instalments, mortgage]
      properties:
        plan:
          type: object
          required: [code, name, summary, discountBP]
          properties:
            code: { type: string, enum: [staged, cash, mortgage] }
            name: { type: string }
            summary: { type: string }
            discountBP: { type: integer }
        listPrice: { type: integer }
        discount: { type: integer }
        price: { type: integer }
        completion: { $ref: "#/components/schemas/Date" }
        instalments:
          type: array
          items:
            type: object
            required: [label, due, amount, percentBP, note]
            properties:
              label: { type: string }
              due: { $ref: "#/components/schemas/DateOrEmpty" }
              amount: { type: integer }
              percentBP: { type: integer }
              note: { type: string }
        mortgage:
          oneOf:
            - type: "null"
            - type: object
              required: [loan, rateBP, years, monthly, totalPaid, firstMonth]
              properties:
                loan: { type: integer }
                rateBP: { type: integer }
                years: { type: integer }
                monthly: { type: integer }
                totalPaid: { type: integer }
                firstMonth: { $ref: "#/components/schemas/Date" }

    TypeDetail:
      type: object
      required: [type, plan, homes]
      properties:
        type: { $ref: "#/components/schemas/TypeSummary" }
        plan: { $ref: "#/components/schemas/Plan" }
        homes: { type: array, items: { $ref: "#/components/schemas/Home" } }

    Plan:
      type: object
      description: A floor plan as geometry. y runs from the main façade inwards.
      required: [type, w, d, rooms, doors, openings, windows, bay, bayCorner, outdoor, outdoorName, outdoorMore, items]
      properties:
        type: { type: string }
        w: { type: number }
        d: { type: number }
        rooms:
          type: array
          items:
            type: object
            required: [name, kind, rects, area, size]
            properties:
              name: { type: string }
              kind: { type: string }
              rects: { type: array, items: { $ref: "#/components/schemas/Rect" } }
              area: { type: number }
              size: { type: string }
        doors:
          type: array
          items:
            type: object
            required: [x, y, width, vertical, into, hingeAtEnd, entrance, service]
            properties:
              x: { type: number }
              y: { type: number }
              width: { type: number }
              vertical: { type: boolean }
              into: { type: integer, enum: [-1, 1] }
              hingeAtEnd: { type: boolean }
              entrance: { type: boolean }
              service: { type: boolean }
        openings: { type: array, items: { $ref: "#/components/schemas/Rect" } }
        windows: { type: array, items: { $ref: "#/components/schemas/Rect" } }
        bay: { $ref: "#/components/schemas/Rect" }
        bayCorner: { type: boolean }
        outdoor: { $ref: "#/components/schemas/Rect" }
        outdoorName: { type: string }
        outdoorMore: { type: array, items: { $ref: "#/components/schemas/Rect" } }
        items:
          type: array
          items:
            type: object
            required: [kind, r]
            properties:
              kind: { type: string }
              r: { $ref: "#/components/schemas/Rect" }

    BuildingModel:
      type: object
      description: The tower for the drawings and the 3D view. Rectangles are [x0, z0, x1, z1] in metres.
      required: [plate, core, levels, roof, setback, units, seat, head, lat, lon, status]
      properties:
        plate: { $ref: "#/components/schemas/Rect" }
        core: { $ref: "#/components/schemas/Rect" }
        levels:
          type: array
          items:
            type: object
            required: [level, y, h, kind]
            properties:
              level: { type: integer }
              y: { type: number }
              h: { type: number }
              kind: { type: string, enum: [ground, amenity, homes, penthouse] }
        roof: { type: number }
        setback: { type: number }
        units:
          type: array
          items:
            type: object
            required: [id, l, p, t, f, b, k, o]
            properties:
              id: { type: string }
              l: { type: integer, description: Level. }
              p: { type: integer, description: Position on the floor. }
              t: { type: string, description: Type code. }
              f: { $ref: "#/components/schemas/Rect" }
              b: { $ref: "#/components/schemas/Rect" }
              c: { type: boolean, description: A corner bay. }
              k: { $ref: "#/components/schemas/Rect" }
              o: { type: string, description: "Facings, such as NW." }
              r: { type: boolean, description: On the river side. }
        seat: { type: number }
        head: { type: number }
        lat: { type: number }
        lon: { type: number }
        status:
          type: object
          additionalProperties: { $ref: "#/components/schemas/Status" }

    Progress:
      type: object
      required: [asOf, percent, frame, current, complete, completion, showFlats, storeys, milestones, photos]
      properties:
        asOf: { $ref: "#/components/schemas/Date" }
        percent: { type: integer }
        frame: { type: number }
        current: { type: string }
        complete: { type: boolean }
        completion: { $ref: "#/components/schemas/Date" }
        showFlats: { $ref: "#/components/schemas/Date" }
        storeys: { type: integer }
        milestones:
          type: array
          items:
            type: object
            required: [start, end, title, note, when, status]
            properties:
              start: { $ref: "#/components/schemas/Date" }
              end: { $ref: "#/components/schemas/DateOrEmpty" }
              title: { type: string }
              note: { type: string }
              when: { type: string }
              status: { type: string, enum: [done, now, next] }
        photos:
          type: array
          items:
            type: object
            required: [image, taken, caption]
            properties:
              image: { type: string }
              taken: { $ref: "#/components/schemas/Date" }
              caption: { type: string }

    Calendar:
      type: object
      required: [minutes, days]
      properties:
        minutes: { type: integer, description: How long a viewing lasts. }
        days:
          type: array
          items:
            type: object
            required: [date, open, reason, blocked, free, slots]
            properties:
              date: { $ref: "#/components/schemas/Date" }
              open: { type: boolean }
              reason: { type: string }
              blocked: { type: boolean, description: "Closed for a holiday or by the sales team, not the weekly day off." }
              free: { type: integer }
              slots:
                type: array
                items:
                  type: object
                  required: [start, time, left]
                  properties:
                    start: { $ref: "#/components/schemas/LocalTime" }
                    time: { type: string }
                    left: { type: integer }

    Touch:
      type: object
      description: One arrival at the site, as the browser recorded it.
      required: [source, medium, campaign, referrer, landing, at]
      properties:
        source: { type: string, description: utm_source }
        medium: { type: string, description: utm_medium }
        campaign: { type: string, description: utm_campaign }
        referrer: { type: string, description: The address of the site that sent the visitor. }
        landing: { type: string, description: The first page's path. }
        at: { type: string, format: date-time }
    Source:
      type: object
      description: The visitor's first arrival, and the one that led here.
      required: [first, last]
      properties:
        first: { $ref: "#/components/schemas/Touch" }
        last: { $ref: "#/components/schemas/Touch" }

    ContactFields:
      type: object
      required: [name, email, phone]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        website: { type: string, description: Left empty by people; only robots fill it in. }

    EnquiryInput:
      allOf:
        - $ref: "#/components/schemas/ContactFields"
        - type: object
          required: [message]
          properties:
            message: { type: string }
            interest: { type: string }
            home: { type: string }
            source: { $ref: "#/components/schemas/Source" }
    EnquiryReceived:
      type: object
      required: [firstName, home]
      properties:
        firstName: { type: string }
        home:
          oneOf:
            - { $ref: "#/components/schemas/Home" }
            - { type: "null" }

    WhatsAppInput:
      type: object
      properties:
        home: { type: string }
        source: { $ref: "#/components/schemas/Source" }

    ViewingInput:
      allOf:
        - $ref: "#/components/schemas/ContactFields"
        - type: object
          required: [slot, party]
          properties:
            slot: { $ref: "#/components/schemas/LocalTime" }
            party: { type: integer, minimum: 1, maximum: 6 }
            notes: { type: string }
            home: { type: string }
            source: { $ref: "#/components/schemas/Source" }
    Viewing:
      type: object
      required: [ref, name, email, phone, start, minutes, party, notes, status, home, agent, createdAt]
      properties:
        ref: { type: string }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        start: { $ref: "#/components/schemas/LocalTime" }
        minutes: { type: integer }
        party: { type: integer }
        notes: { type: string }
        status: { type: string, enum: [booked, attended, no_show, cancelled] }
        home:
          oneOf:
            - { $ref: "#/components/schemas/Home" }
            - { type: "null" }
        agent: { type: string, description: The consultant who will show the visitor round. }
        createdAt: { type: string, format: date-time }

    ReservationInput:
      allOf:
        - $ref: "#/components/schemas/ContactFields"
        - type: object
          required: [home, plan, agree]
          properties:
            home: { type: string }
            plan: { type: string }
            buying: { type: string, enum: [home, investment] }
            note: { type: string }
            agree: { type: boolean, description: The buyer confirms they understand how a reservation works. }
            source: { $ref: "#/components/schemas/Source" }
    Reservation:
      type: object
      required: [ref, status, name, email, phone, home, price, note, agent, requested, holdEnds, holdSecondsLeft, decided, declineReason, offerNumber, deposit, depositAmount, schedule]
      properties:
        ref: { type: string }
        status: { type: string, enum: [requested, confirmed, declined, lapsed, completed, cancelled] }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        home: { $ref: "#/components/schemas/Home" }
        price: { type: integer }
        note: { type: string }
        agent: { type: string }
        requested: { $ref: "#/components/schemas/LocalTime" }
        holdEnds: { $ref: "#/components/schemas/LocalTime" }
        holdSecondsLeft: { type: integer }
        decided: { type: string, description: "A time in Nairobi, or empty." }
        declineReason: { type: string }
        offerNumber: { type: string }
        deposit: { type: string, description: "A time in Nairobi, or empty." }
        depositAmount: { type: integer }
        schedule: { $ref: "#/components/schemas/Schedule" }

    LiveEvent:
      type: object
      required: [type]
      properties:
        type: { type: string }
        id: { type: string }
        status: { type: string }
        text: { type: string }

    Stage:
      type: string
      enum: [new, contacted, viewing, reservation, won, lost]
    Channel:
      type: string
      description: How a visitor arrived, as the site works it out from the link they followed.
      enum: [Search, Paid search, Social media, Paid social, Property portal, Email, WhatsApp, Other website, Direct]
    ReservationGroup:
      type: string
      description: "A tab of the reservations page: waiting for a decision, confirmed and awaiting the deposit, sold, or closed."
      enum: [waiting, confirmed, completed, closed]
    Counts:
      type: object
      additionalProperties: { type: integer }

    SignInInput:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string }
    DeskStaff:
      type: object
      description: A member of the sales team.
      required: [id, username, name, role, title, colour, initials]
      properties:
        id: { type: integer }
        username: { type: string }
        name: { type: string }
        role: { type: string, enum: [manager, agent] }
        title: { type: string }
        colour: { type: string }
        initials: { type: string }
    DeskSession:
      type: object
      required: [staff, manager, waiting]
      properties:
        staff: { $ref: "#/components/schemas/DeskStaff" }
        manager: { type: boolean, description: "The sales manager may change prices and statuses, decide reservations and see every lead." }
        waiting: { type: integer, description: Reservation requests waiting for a decision. }
    DeskTeam:
      type: object
      required: [team]
      properties:
        team: { type: array, items: { $ref: "#/components/schemas/DeskStaff" } }

    DeskHome:
      type: object
      description: A home as the desk sees it, with its price whatever its status.
      required: [id, level, number, type, typeName, title, facings, internal, riverView, status, statusName, price, listPrice, overridden, wide]
      properties:
        id: { type: string }
        level: { type: integer }
        number: { type: integer }
        type: { type: string, enum: [A, B, C, D, P] }
        typeName: { type: string }
        title: { type: string }
        facings: { type: string }
        internal: { type: integer }
        riverView: { type: boolean }
        status: { $ref: "#/components/schemas/Status" }
        statusName: { type: string }
        price: { type: integer }
        listPrice: { type: integer }
        overridden: { type: boolean, description: "The home has its own price rather than the price list's." }
        wide: { type: boolean, description: "A penthouse, which takes half its floor on the stacking plan." }
    DeskReservation:
      type: object
      required: [ref, status, statusName, group, leadId, name, email, phone, home, plan, planName, price, note, agent, requested, holdEnds, holdSecondsLeft, decided, decidedBy, declineReason, offerNumber, offer, deposit, depositAmount, suggestedDeposit]
      properties:
        ref: { type: string }
        status: { type: string, enum: [requested, confirmed, declined, lapsed, completed, cancelled] }
        statusName: { type: string }
        group: { $ref: "#/components/schemas/ReservationGroup" }
        leadId: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        home: { type: string }
        plan: { type: string }
        planName: { type: string }
        price: { type: integer }
        note: { type: string, description: The buyer's own note. }
        agent: { type: string }
        requested: { $ref: "#/components/schemas/LocalTime" }
        holdEnds: { $ref: "#/components/schemas/LocalTime" }
        holdSecondsLeft: { type: integer }
        decided: { type: string, description: "A time in Nairobi, or empty." }
        decidedBy: { type: string }
        declineReason: { type: string }
        offerNumber: { type: string }
        offer: { type: string, description: "The letter of offer's address, or empty before one is issued." }
        deposit: { type: string, description: "A time in Nairobi, or empty." }
        depositAmount: { type: integer }
        suggestedDeposit: { type: integer, description: "A tenth of the price, which the deposit form starts from." }
    DeskViewing:
      type: object
      required: [ref, leadId, name, email, phone, home, start, minutes, party, status, notes, outcome, agent, booked, due]
      properties:
        ref: { type: string }
        leadId: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        home: { type: string, description: "The home the visitor asked to see, or empty." }
        start: { $ref: "#/components/schemas/LocalTime" }
        minutes: { type: integer }
        party: { type: integer }
        status: { type: string, enum: [booked, attended, no_show, cancelled] }
        notes: { type: string }
        outcome: { type: string, description: What the agent wrote after the visit. }
        agent: { type: string }
        booked: { $ref: "#/components/schemas/LocalTime" }
        due: { type: boolean, description: "A booked viewing whose time has come, waiting for the agent to say whether the visitor came." }
    DeskLead:
      type: object
      required: [id, name, email, phone, source, stage, stageTitle, agentId, agent, agentColour, interest, budget, buying, followUpOn, overdue, lostReason, created, updated, stageChanged]
      properties:
        id: { type: integer }
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        source: { type: string, description: "The website's channel for their first arrival, or what the team wrote down, such as Referral." }
        stage: { $ref: "#/components/schemas/Stage" }
        stageTitle: { type: string }
        agentId: { type: integer }
        agent: { type: string }
        agentColour: { type: string }
        interest: { type: string }
        budget: { type: integer }
        buying: { type: string, enum: ["", home, investment] }
        followUpOn: { $ref: "#/components/schemas/DateOrEmpty" }
        overdue: { type: boolean }
        lostReason: { type: string }
        created: { $ref: "#/components/schemas/LocalTime" }
        updated: { $ref: "#/components/schemas/LocalTime" }
        stageChanged: { $ref: "#/components/schemas/LocalTime" }

    DeskDashboard:
      type: object
      required: [asOf, counts, total, stock, soldValue, months, newLeads, newLeadsWas, funnel, sources, week, waitingTotal, waiting, followUpsTotal, followUps, channels, whatsapp]
      properties:
        asOf: { $ref: "#/components/schemas/Date" }
        counts: { $ref: "#/components/schemas/Counts" }
        total: { type: integer }
        stock: { type: integer, description: "The price of every home still to sell: available, on hold or withheld." }
        soldValue: { type: integer, description: The price of every confirmed or completed reservation. }
        months:
          type: array
          description: The homes sold in each of the last eight months, this one last.
          items:
            type: object
            required: [month, label, sold, value]
            properties:
              month: { type: string, pattern: "^[0-9]{4}-[0-9]{2}$" }
              label: { type: string }
              sold: { type: integer }
              value: { type: integer }
        newLeads: { type: integer, description: Leads in the last seven days. }
        newLeadsWas: { type: integer, description: Leads in the seven days before. }
        funnel:
          type: array
          description: How far leads have got. A lead counts in every stage it has passed; a lost lead only in Lost and New.
          items:
            type: object
            required: [stage, label, n, reached, percent, lost]
            properties:
              stage: { $ref: "#/components/schemas/Stage" }
              label: { type: string }
              n: { type: integer }
              reached: { type: integer }
              percent: { type: integer }
              lost: { type: boolean }
        sources:
          type: array
          description: Every lead by where it came from, the commonest first.
          items:
            type: object
            required: [source, leads]
            properties:
              source: { type: string }
              leads: { type: integer }
        week:
          type: array
          description: The viewings from today to a week ahead.
          items: { $ref: "#/components/schemas/DeskViewing" }
        waitingTotal: { type: integer }
        waiting:
          type: array
          description: The six newest reservation requests waiting for a decision.
          items: { $ref: "#/components/schemas/DeskReservation" }
        followUpsTotal: { type: integer }
        followUps:
          type: array
          description: Up to six open leads due a follow-up; an agent sees only their own.
          items: { $ref: "#/components/schemas/DeskLead" }
        channels:
          type: array
          description: |
            The leads the website brought in, by the channel of their first
            arrival: how many came, how many of them booked a viewing they did
            not cancel, and how many asked to reserve a home. Leads added by
            hand, and people the team knew before they used the website, are
            left out. Every channel is listed, in order.
          items:
            type: object
            required: [channel, leads, viewed, reserved]
            properties:
              channel: { $ref: "#/components/schemas/Channel" }
              leads: { type: integer }
              viewed: { type: integer }
              reserved: { type: integer }
        whatsapp:
          type: array
          description: Taps on WhatsApp links in the last 30 days, by the channel each visitor arrived through. Every channel is listed, in order.
          items:
            type: object
            required: [channel, taps]
            properties:
              channel: { $ref: "#/components/schemas/Channel" }
              taps: { type: integer }

    DeskStack:
      type: object
      required: [floors, counts, total]
      properties:
        floors:
          type: array
          description: Every floor with homes, the top floor first.
          items:
            type: object
            required: [level, name, homes]
            properties:
              level: { type: integer }
              name: { type: string }
              homes: { type: array, items: { $ref: "#/components/schemas/DeskHome" } }
        counts: { $ref: "#/components/schemas/Counts" }
        total: { type: integer }
    DeskHomeDetail:
      type: object
      required: [home, history, reservation, canChange, notice]
      properties:
        home: { $ref: "#/components/schemas/DeskHome" }
        history:
          type: array
          description: The home's changes, newest first. A status change runs between statuses; a price change between prices or "list price".
          items:
            type: object
            required: [at, kind, from, to, reason, staff]
            properties:
              at: { $ref: "#/components/schemas/LocalTime" }
              kind: { type: string, enum: [status, price] }
              from: { type: string }
              to: { type: string }
              reason: { type: string }
              staff: { type: string }
        reservation:
          oneOf:
            - { $ref: "#/components/schemas/DeskReservation" }
            - { type: "null" }
        canChange: { type: boolean, description: "Only the sales manager may change a home's status or price." }
        notice: { type: string, description: What a change just did; empty on a read. }
    DeskStatusInput:
      type: object
      required: [status, reason]
      properties:
        status: { type: string, enum: [withheld, available] }
        reason: { type: string }
    DeskPriceInput:
      type: object
      required: [price, reason]
      properties:
        price: { type: integer, minimum: 0, description: "In KES, to the nearest 10,000; 0 puts the home back on the list price." }
        reason: { type: string }

    DeskLeads:
      type: object
      required: [filter, leads, more, columns, counts, total, sources, csv]
      properties:
        filter:
          type: object
          description: The filters as they were applied.
          required: [stage, agent, q, source, sort, view]
          properties:
            stage:
              oneOf:
                - { $ref: "#/components/schemas/Stage" }
                - { type: string, enum: [""] }
            agent: { type: integer, description: "The member whose leads are shown, or 0 for everyone's." }
            q: { type: string }
            source: { type: string }
            sort: { type: string, enum: [recent, name, follow, board] }
            view: { type: string, enum: [table, board] }
        leads:
          type: array
          description: The table, up to 300; empty on the board.
          items: { $ref: "#/components/schemas/DeskLead" }
        more: { type: boolean, description: More leads match than the table holds. }
        columns:
          type: array
          description: The board, a column for each stage; empty for the table. The won and lost columns show only their most recent.
          items:
            type: object
            required: [stage, title, leads, more]
            properties:
              stage: { $ref: "#/components/schemas/Stage" }
              title: { type: string }
              leads: { type: array, items: { $ref: "#/components/schemas/DeskLead" } }
              more: { type: integer, description: Leads at the stage the board leaves out. }
        counts: { $ref: "#/components/schemas/Counts" }
        total: { type: integer }
        sources: { type: array, description: "Every source leads have come from, the commonest first.", items: { type: string } }
        csv: { type: string, description: The same list as a spreadsheet. }
    DeskArrival:
      type: object
      description: One arrival at the site.
      required: [channel, source, medium, campaign, referrer, landing, at]
      properties:
        channel: { $ref: "#/components/schemas/Channel" }
        source: { type: string }
        medium: { type: string }
        campaign: { type: string }
        referrer: { type: string, description: The host of the site that sent the visitor. }
        landing: { type: string }
        at: { $ref: "#/components/schemas/LocalTime" }
    DeskLeadPage:
      type: object
      required: [lead, timeline, viewings, reservations, touches, notice]
      properties:
        lead: { $ref: "#/components/schemas/DeskLead" }
        timeline:
          type: array
          description: The lead's history, newest first.
          items:
            type: object
            required: [at, kind, body, home, staff]
            properties:
              at: { $ref: "#/components/schemas/LocalTime" }
              kind: { type: string }
              body: { type: string }
              home: { type: string }
              staff: { type: string }
        viewings: { type: array, items: { $ref: "#/components/schemas/DeskViewing" } }
        reservations: { type: array, items: { $ref: "#/components/schemas/DeskReservation" } }
        touches:
          type: array
          description: What the lead sent from the website, newest first, with where they came from each time.
          items:
            type: object
            required: [at, action, home, last, first]
            properties:
              at: { $ref: "#/components/schemas/LocalTime" }
              action: { type: string, enum: [enquiry, viewing, reservation] }
              home: { type: string }
              last: { $ref: "#/components/schemas/DeskArrival" }
              first: { $ref: "#/components/schemas/DeskArrival" }
        notice: { type: string, description: What a change just did; empty on a read. }
    DeskLeadInput:
      type: object
      required: [name, email, phone]
      properties:
        name: { type: string }
        email: { type: string }
        phone: { type: string }
        source: { type: string, description: "Such as Walk-in, Phone call or Referral; Walk-in when left out." }
        interest: { type: string }
        buying: { type: string, enum: [home, investment] }
        agent: { type: integer, description: "Who looks after the lead. Only the manager chooses; an agent's new lead is their own." }
        note: { type: string }
    DeskNoteInput:
      type: object
      required: [body]
      properties:
        body: { type: string }
    DeskStageInput:
      type: object
      required: [stage]
      properties:
        stage: { $ref: "#/components/schemas/Stage" }
        reason: { type: string, description: Why a lost lead was lost. }
    DeskFollowUpInput:
      type: object
      required: [day]
      properties:
        day: { $ref: "#/components/schemas/DateOrEmpty" }
    DeskAssignInput:
      type: object
      required: [agent]
      properties:
        agent: { type: integer }
    DeskMoveInput:
      type: object
      required: [stage]
      properties:
        stage: { $ref: "#/components/schemas/Stage" }
        reason: { type: string, description: Why a lost lead was lost. }
        after: { type: integer, description: "The card now above it, or 0 at the top." }
        before: { type: integer, description: "The card now below it, or 0 at the bottom." }

    DeskHours:
      type: object
      required: [days, times, capacity, minutes]
      properties:
        days: { type: array, description: "0 for Sunday to 6 for Saturday.", items: { type: integer, minimum: 0, maximum: 6 } }
        times: { type: array, items: { type: string, pattern: "^[0-9]{2}:[0-9]{2}$" } }
        capacity: { type: integer, description: Parties a slot takes at once. }
        minutes: { type: integer, description: How long a visit takes. }
    DeskBlock:
      type: object
      required: [day, reason]
      properties:
        day: { $ref: "#/components/schemas/Date" }
        reason: { type: string }
    DeskAgenda:
      type: object
      required: [from, to, days, viewings, hours, blocks]
      properties:
        from: { $ref: "#/components/schemas/Date" }
        to: { $ref: "#/components/schemas/Date" }
        days:
          type: array
          items:
            type: object
            required: [date, open, blocked, viewings]
            properties:
              date: { $ref: "#/components/schemas/Date" }
              open: { type: boolean, description: The suite opens that day and nobody has closed it. }
              blocked: { type: string, description: "Why the day was closed, or empty." }
              viewings: { type: integer, description: "Visits booked that day, leaving out cancelled ones." }
        viewings: { type: array, description: "Every viewing in those days, earliest first.", items: { $ref: "#/components/schemas/DeskViewing" } }
        hours: { $ref: "#/components/schemas/DeskHours" }
        blocks: { type: array, description: Every closed day from today on., items: { $ref: "#/components/schemas/DeskBlock" } }
    DeskOutcomeInput:
      type: object
      required: [outcome]
      properties:
        outcome: { type: string, enum: [attended, no_show] }
        notes: { type: string }
    DeskHoursInput:
      type: object
      required: [days, times, capacity]
      properties:
        days: { type: array, description: "0 for Sunday to 6 for Saturday.", items: { type: integer } }
        times: { type: array, description: "24-hour start times, such as 10:00.", items: { type: string } }
        capacity: { type: integer, minimum: 1, maximum: 6 }
    DeskBlockInput:
      type: object
      required: [day, reason]
      properties:
        day: { $ref: "#/components/schemas/Date" }
        reason: { type: string }
    DeskViewingResult:
      type: object
      required: [viewing, notice]
      properties:
        viewing: { $ref: "#/components/schemas/DeskViewing" }
        notice: { type: string }
    DeskHoursResult:
      type: object
      required: [hours, notice]
      properties:
        hours: { $ref: "#/components/schemas/DeskHours" }
        notice: { type: string }
    DeskBlocksResult:
      type: object
      required: [blocks, notice]
      properties:
        blocks: { type: array, items: { $ref: "#/components/schemas/DeskBlock" } }
        notice: { type: string }

    DeskReservations:
      type: object
      required: [group, counts, reservations]
      properties:
        group: { $ref: "#/components/schemas/ReservationGroup" }
        counts: { $ref: "#/components/schemas/Counts" }
        reservations:
          type: array
          description: The waiting by when their hold lapses, the rest newest first.
          items: { $ref: "#/components/schemas/DeskReservation" }
    DeskReservationResult:
      type: object
      required: [reservation, home, notice]
      properties:
        reservation: { $ref: "#/components/schemas/DeskReservation" }
        home: { $ref: "#/components/schemas/DeskHome" }
        notice: { type: string }
    DeskDeclineInput:
      type: object
      required: [reason]
      properties:
        reason: { type: string, description: Shown to the buyer. }
    DeskDepositInput:
      type: object
      required: [amount]
      properties:
        amount: { type: integer, description: In KES. }

    PriceBases:
      type: object
      description: The price in KES of each type on level 2 without a river view, to the nearest 10,000.
      required: [A, B, C, D, P]
      properties:
        A: { type: integer }
        B: { type: integer }
        C: { type: integer }
        D: { type: integer }
        P: { type: integer }
    PriceListInput:
      type: object
      description: "A price list: a base price for each type, raised for each floor above level 2 and for a river view."
      required: [base, floorBP, riverBP]
      properties:
        base: { $ref: "#/components/schemas/PriceBases" }
        floorBP: { type: integer, description: "The premium for each floor above level 2, in basis points: 100 is 1%." }
        riverBP: { type: integer, description: "The premium for a river view, in basis points." }
    DeskPricingInput:
      type: object
      required: [list]
      properties:
        list: { $ref: "#/components/schemas/PriceListInput" }
        note: { type: string, description: What changed. }
    DeskPriceList:
      type: object
      required: [id, published, by, note, base, floorBP, riverBP]
      properties:
        id: { type: integer }
        published: { $ref: "#/components/schemas/LocalTime" }
        by: { type: string }
        note: { type: string }
        base: { $ref: "#/components/schemas/PriceBases" }
        floorBP: { type: integer }
        riverBP: { type: integer }
    DeskPricing:
      type: object
      required: [current, history, notice]
      properties:
        current: { $ref: "#/components/schemas/DeskPriceList" }
        history: { type: array, description: "Every published list, newest first.", items: { $ref: "#/components/schemas/DeskPriceList" } }
        notice: { type: string, description: What publishing just did; empty on a read. }
    DeskPricePreview:
      type: object
      required: [list, note, rows, oldTotal, newTotal, changed, keptOwn]
      properties:
        list: { $ref: "#/components/schemas/PriceListInput" }
        note: { type: string }
        rows:
          type: array
          description: Every home not yet reserved or sold, those whose price changes first.
          items:
            type: object
            required: [home, type, level, status, old, new, change, keepsOwn]
            properties:
              home: { type: string }
              type: { type: string, enum: [A, B, C, D, P] }
              level: { type: integer }
              status: { $ref: "#/components/schemas/Status" }
              old: { type: integer }
              new: { type: integer }
              change: { type: integer }
              keepsOwn: { type: boolean, description: "A home with its own price, which a new list leaves alone." }
        oldTotal: { type: integer }
        newTotal: { type: integer }
        changed: { type: integer, description: Homes the list would reprice. }
        keptOwn: { type: integer, description: Homes keeping a price of their own. }

    DeskActivity:
      type: object
      required: [kind, offset, entries, more, next]
      properties:
        kind: { type: string, enum: ["", staff, visitor, system] }
        offset: { type: integer }
        entries:
          type: array
          items:
            type: object
            description: "A line of the log. The action marks where the subject goes with {}; without a mark the subject comes last."
            required: [id, at, actor, staff, colour, action, subject, detail, link]
            properties:
              id: { type: integer }
              at: { $ref: "#/components/schemas/LocalTime" }
              actor: { type: string, enum: [staff, visitor, system] }
              staff: { type: string }
              colour: { type: string }
              action: { type: string }
              subject: { type: string }
              detail: { type: string }
              link: { type: string, description: "The desk's page about the subject, or empty." }
        more: { type: boolean, description: There are older lines. }
        next: { type: integer, description: The offset that reads them. }
