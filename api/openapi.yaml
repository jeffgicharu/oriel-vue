openapi: 3.1.0
info:
  title: Oriel API
  version: "1"
  summary: The homes, prices, plans, viewings, enquiries and reservations of Oriel, Riverside.
  description: |
    The REST JSON API behind Oriel's website and sales desk. The web server
    renders pages from it, and browsers call it directly afterwards, on the
    same address under /api.

    Every visitor reads the shared sample until they first send something;
    from then on they have a private copy, named by an HttpOnly cookie the
    API sets. Errors are problem documents (RFC 9457). A 422 names each form
    field that needs another look in `errors`.

    The sales desk lives under /api/desk. A member of the team signs in by
    password or by a one-click link and gets the oriel_desk cookie, which
    works with the copy it was made on. Most desk operations are open to the
    whole team; those marked for the sales manager answer 403 to an agent.

    Oriel is an invented development and everything in it is sample data.
servers:
  - url: /
tags:
  - name: building
    description: The building and its homes.
  - name: visitors
    description: What visitors send.
  - name: system
    description: Health and live updates.
  - name: desk
    description: The sales desk, for the sales team.

paths:
  /api/healthz:
    get:
      tags: [system]
      operationId: healthz
      summary: Which release this is, and that the sample can be read.
      responses:
        "200":
          description: Healthy.
          headers:
            X-Release:
              schema: { type: string }
          content:
            application/json:
              schema:
                type: object
                required: [release]
                properties:
                  release: { type: string }
        "503": { $ref: "#/components/responses/Problem" }

  /api/events:
    get:
      tags: [system]
      operationId: events
      summary: Live updates for this visitor's copy, as server-sent events.
      description: |
        Opens with a retry line, sends a comment every 20 seconds and ends
        after a few minutes; the browser reconnects. Each change is an event
        named `change` whose data is a LiveEvent.
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        "503": { $ref: "#/components/responses/Problem" }

  /api/overview:
    get:
      tags: [building]
      operationId: overview
      summary: The building as it stands today.
      responses:
        "200":
          description: The overview.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Overview" }

  /api/building:
    get:
      tags: [building]
      operationId: buildingModel
      summary: The tower's geometry with every home's status, for drawings and 3D.
      responses:
        "200":
          description: The model.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/BuildingModel" }

  /api/progress:
    get:
      tags: [building]
      operationId: progress
      summary: The construction programme as it stands today.
      responses:
        "200":
          description: The programme.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Progress" }

  /api/homes:
    get:
      tags: [building]
      operationId: listHomes
      summary: The homes, filtered and sorted.
      description: Unknown or out-of-range filters are dropped; the answer says which filters applied.
      parameters:
        - { name: beds, in: query, schema: { type: integer, minimum: 1, maximum: 4 } }
        - { name: max, in: query, description: Highest price in KES., schema: { type: integer, minimum: 1 } }
        - { name: floors, in: query, schema: { type: string, enum: [lower, middle, upper] } }
        - { name: side, in: query, schema: { type: string, enum: [river, garden] } }
        - { name: show, in: query, description: "`all` includes homes no longer available.", schema: { type: string, enum: [all] } }
        - { name: sort, in: query, schema: { type: string, enum: [price, price-desc, floor, size] } }
        - { name: ids, in: query, description: "Up to twelve homes by number, separated by commas, such as a shortlist. They come back in that order, whatever their status, and the filters are ignored.", schema: { type: string } }
      responses:
        "200":
          description: The list.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeList" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/homes/{id}:
    get:
      tags: [building]
      operationId: getHome
      summary: Everything a home's page shows.
      parameters:
        - $ref: "#/components/parameters/HomeId"
      responses:
        "200":
          description: The home.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/HomeDetail" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/homes/{id}/schedule:
    get:
      tags: [building]
      operationId: getSchedule
      summary: One plan's payment schedule for a home, with the buyer's own mortgage rate and term.
      parameters:
        - $ref: "#/components/parameters/HomeId"
        - { name: plan, in: query, required: true, schema: { type: string, enum: [staged, cash, mortgage] } }
        - { name: rate, in: query, description: Mortgage rate in basis points., schema: { type: integer, minimum: 500, maximum: 2500 } }
        - { name: years, in: query, schema: { type: integer, minimum: 5, maximum: 25 } }
      responses:
        "200":
          description: The schedule.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Schedule" }
        "404": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/types/{code}:
    get:
      tags: [building]
      operationId: getType
      summary: A kind of home, its plan and every home of it.
      parameters:
        - { name: code, in: path, required: true, schema: { type: string, enum: [A, B, C, D, P, a, b, c, d, p] } }
      responses:
        "200":
          description: The type.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/TypeDetail" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/plans:
    get:
      tags: [building]
      operationId: typePlans
      summary: Every type's plan, keyed by type.
      responses:
        "200":
          description: The plans.
          content:
            application/json:
              schema:
                type: object
                required: [A, B, C, D, P]
                properties:
                  A: { $ref: "#/components/schemas/Plan" }
                  B: { $ref: "#/components/schemas/Plan" }
                  C: { $ref: "#/components/schemas/Plan" }
                  D: { $ref: "#/components/schemas/Plan" }
                  P: { $ref: "#/components/schemas/Plan" }

  /api/payment-plans:
    get:
      tags: [building]
      operationId: paymentPlans
      summary: Each way to pay, worked out on one price.
      parameters:
        - { name: price, in: query, description: "In KES; 18,000,000 when left out.", schema: { type: integer, minimum: 1000000, maximum: 500000000 } }
      responses:
        "200":
          description: One schedule per plan.
          content:
            application/json:
              schema:
                type: object
                required: [schedules]
                properties:
                  schedules: { type: array, items: { $ref: "#/components/schemas/Schedule" } }
        "422": { $ref: "#/components/responses/Problem" }

  /api/compare:
    get:
      tags: [building]
      operationId: compareHomes
      summary: Up to three homes side by side.
      parameters:
        - { name: homes, in: query, required: true, description: Home numbers separated by commas., schema: { type: string } }
      responses:
        "200":
          description: The homes found, in the order asked for.
          content:
            application/json:
              schema:
                type: object
                required: [homes]
                properties:
                  homes:
                    type: array
                    maxItems: 3
                    items: { $ref: "#/components/schemas/HomeDetail" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/price-list.pdf:
    get:
      tags: [building]
      operationId: priceList
      summary: The current price list as a PDF.
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }

  /api/enquiries:
    post:
      tags: [visitors]
      operationId: enquire
      summary: Ask the sales team a question.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnquiryInput" }
      responses:
        "201":
          description: Received.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/EnquiryReceived" }
        "400": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/whatsapp:
    post:
      tags: [visitors]
      operationId: recordWhatsApp
      summary: Record a tap on a WhatsApp link, with where the visitor came from.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WhatsAppInput" }
      responses:
        "204": { description: Recorded. }
        "400": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/viewings/calendar:
    get:
      tags: [visitors]
      operationId: viewingCalendar
      summary: The days and times a visitor can book.
      responses:
        "200":
          description: The calendar.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Calendar" }

  /api/viewings:
    post:
      tags: [visitors]
      operationId: bookViewing
      summary: Book a viewing at the sales suite.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ViewingInput" }
      responses:
        "201":
          description: Booked.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Viewing" }
        "400": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/viewings/{ref}:
    get:
      tags: [visitors]
      operationId: getViewing
      summary: A viewing booked from this browser.
      parameters:
        - $ref: "#/components/parameters/ViewingRef"
      responses:
        "200":
          description: The viewing.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Viewing" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/viewings/{ref}/cancel:
    post:
      tags: [visitors]
      operationId: cancelViewing
      summary: Cancel a viewing booked from this browser.
      parameters:
        - $ref: "#/components/parameters/ViewingRef"
      responses:
        "200":
          description: Cancelled.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Viewing" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/viewings/{ref}/calendar.ics:
    get:
      tags: [visitors]
      operationId: viewingCalendarFile
      summary: A viewing as a calendar file.
      parameters:
        - $ref: "#/components/parameters/ViewingRef"
      responses:
        "200":
          description: The calendar file.
          content:
            text/calendar:
              schema: { type: string }
        "404": { $ref: "#/components/responses/Problem" }

  /api/reservations:
    post:
      tags: [visitors]
      operationId: reserve
      summary: Request a reservation; the home is held for 72 hours while the sales team confirms it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReservationInput" }
      responses:
        "201":
          description: Requested, and the home held.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "400": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/reservations/{ref}:
    get:
      tags: [visitors]
      operationId: getReservation
      summary: A reservation made from this browser.
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The reservation.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Reservation" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/reservations/{ref}/offer.pdf:
    get:
      tags: [visitors]
      operationId: offerLetter
      summary: A confirmed reservation's letter of offer.
      parameters:
        - { name: ref, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: The PDF.
          content:
            application/pdf:
              schema: { type: string, format: binary }
        "404": { $ref: "#/components/responses/Problem" }

  /api/privacy:
    get:
      tags: [visitors]
      operationId: privacy
      summary: Whether this browser has sent anything there is to delete.
      responses:
        "200":
          description: The answer.
          content:
            application/json:
              schema:
                type: object
                required: [hasCopy]
                properties:
                  hasCopy: { type: boolean }

  /api/privacy/delete:
    post:
      tags: [visitors]
      operationId: deleteMine
      summary: Delete this browser's private copy, with everything it sent.
      responses:
        "204": { description: Deleted. }

  /api/desk/session:
    post:
      tags: [desk]
      operationId: deskSignIn
      summary: Sign in to the sales desk with a username and password.
      description: |
        Signs in on this browser's own copy, making one if need be, and sets
        the oriel_desk cookie. Wrong details answer 401 without saying which
        was wrong.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/SignInInput" }
      responses:
        "200":
          description: Signed in.
          headers:
            Set-Cookie:
              description: The oriel_desk session, and the oriel_copy cookie when a copy was made.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskSession" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }
    get:
      tags: [desk]
      operationId: deskSession
      summary: Who is signed in, and their role.
      security: [{ deskSession: [] }]
      responses:
        "200":
          description: The member signed in.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskSession" }
        "401": { $ref: "#/components/responses/Problem" }
    delete:
      tags: [desk]
      operationId: deskSignOut
      summary: Sign out of the desk.
      responses:
        "204":
          description: Signed out, or never signed in.
          headers:
            Set-Cookie:
              description: The oriel_desk cookie, expired.
              schema: { type: string }

  /api/desk/enter/{role}/{sig}:
    get:
      tags: [desk]
      operationId: deskEnter
      summary: A one-click sign-in link to a fresh copy of the business.
      description: |
        Makes a new copy, signs in on it as the first member with the role,
        sets the oriel_copy and oriel_desk cookies and sends the browser to
        the desk. The signature comes from the desk key; a wrong one is
        answered as a page that does not exist.
      parameters:
        - { name: role, in: path, required: true, schema: { type: string, enum: [manager, agent] } }
        - { name: sig, in: path, required: true, schema: { type: string } }
      responses:
        "303":
          description: Signed in; on to /desk.
          headers:
            Location:
              schema: { type: string, enum: [/desk] }
            Set-Cookie:
              description: The new copy and the session.
              schema: { type: string }
        "404": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/desk/events:
    get:
      tags: [desk]
      operationId: deskEvents
      summary: Live updates for the desk's copy, as server-sent events.
      description: |
        The same stream as /api/events, for the team alone. Changes made on
        the desk are sent as events of type `unit`, `reservation`,
        `lead-changed` and `prices`.
      security: [{ deskSession: [] }]
      responses:
        "200":
          description: The stream.
          content:
            text/event-stream:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }
        "503": { $ref: "#/components/responses/Problem" }

  /api/desk/team:
    get:
      tags: [desk]
      operationId: deskTeam
      summary: The sales team, the manager first.
      security: [{ deskSession: [] }]
      responses:
        "200":
          description: The team.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskTeam" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/desk/dashboard:
    get:
      tags: [desk]
      operationId: deskDashboard
      summary: The desk's front page, with where leads came from.
      security: [{ deskSession: [] }]
      responses:
        "200":
          description: The dashboard.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskDashboard" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/desk/stack:
    get:
      tags: [desk]
      operationId: deskStack
      summary: The stacking plan, every home by floor with its status and price.
      security: [{ deskSession: [] }]
      responses:
        "200":
          description: The stacking plan.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskStack" }
        "401": { $ref: "#/components/responses/Problem" }

  /api/desk/homes/{id}:
    get:
      tags: [desk]
      operationId: deskHome
      summary: A home's drawer, with its history and its reservation.
      security: [{ deskSession: [] }]
      parameters:
        - $ref: "#/components/parameters/HomeId"
      responses:
        "200":
          description: The home.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskHomeDetail" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/desk/homes/{id}/status:
    post:
      tags: [desk]
      operationId: deskHomeStatus
      summary: Withhold a home from sale or release it. For the sales manager.
      security: [{ deskSession: [] }]
      parameters:
        - $ref: "#/components/parameters/HomeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeskStatusInput" }
      responses:
        "200":
          description: Changed; the home's drawer as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskHomeDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/desk/homes/{id}/price:
    post:
      tags: [desk]
      operationId: deskHomePrice
      summary: Give a home its own price, or put it back on the list price. For the sales manager.
      security: [{ deskSession: [] }]
      parameters:
        - $ref: "#/components/parameters/HomeId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeskPriceInput" }
      responses:
        "200":
          description: Changed; the home's drawer as it now stands.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskHomeDetail" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/desk/leads:
    get:
      tags: [desk]
      operationId: deskLeads
      summary: The leads, as a table or as the pipeline board.
      description: Unknown filters are dropped; the answer says which applied. An agent sees only their own leads.
      security: [{ deskSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LeadStage"
        - $ref: "#/components/parameters/LeadAgent"
        - $ref: "#/components/parameters/LeadQuery"
        - $ref: "#/components/parameters/LeadSource"
        - $ref: "#/components/parameters/LeadSort"
        - name: view
          in: query
          description: "`board` gives a column for each stage instead of the table."
          schema: { type: string, enum: [table, board] }
      responses:
        "200":
          description: The leads.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskLeads" }
        "401": { $ref: "#/components/responses/Problem" }
    post:
      tags: [desk]
      operationId: deskAddLead
      summary: Add a lead by hand.
      security: [{ deskSession: [] }]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeskLeadInput" }
      responses:
        "201":
          description: Added; the lead's page.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskLeadPage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

  /api/desk/leads.csv:
    get:
      tags: [desk]
      operationId: deskLeadsCSV
      summary: The leads as a spreadsheet, with where each first came from on the website.
      security: [{ deskSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LeadStage"
        - $ref: "#/components/parameters/LeadAgent"
        - $ref: "#/components/parameters/LeadQuery"
        - $ref: "#/components/parameters/LeadSource"
        - $ref: "#/components/parameters/LeadSort"
      responses:
        "200":
          description: The CSV file.
          content:
            text/csv:
              schema: { type: string }
        "401": { $ref: "#/components/responses/Problem" }

  /api/desk/leads/{id}:
    get:
      tags: [desk]
      operationId: deskLead
      summary: A lead's page, with its history, bookings and visits to the website.
      security: [{ deskSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LeadId"
      responses:
        "200":
          description: The lead.
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DeskLeadPage" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }

  /api/desk/leads/{id}/notes:
    post:
      tags: [desk]
      operationId: deskLeadNote
      summary: Write a note on a lead.
      security: [{ deskSession: [] }]
      parameters:
        - $ref: "#/components/parameters/LeadId"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/DeskNoteInput" }
      responses:
        "200": { $ref: "#/components/responses/DeskLeadChanged" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "422": { $ref: "#/components/responses/Problem" }

